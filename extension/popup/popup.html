<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        width: 320px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #1e293b;
        background: #f8fafc;
      }
      .header {
        background: #1e1e24;
        color: #fff;
        padding: 12px 16px;
        font-weight: 600;
      }
      .section {
        padding: 12px 16px;
        border-bottom: 1px solid #e2e8f0;
      }
      .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #64748b;
        margin-bottom: 4px;
      }
      #current-tab-status {
        font-size: 13px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      button {
        background: #2451d9;
        color: #fff;
        border: none;
        padding: 7px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        width: 100%;
      }
      button:disabled {
        background: #94a3b8;
      }
      .saved {
        color: #059669;
        font-size: 12px;
        margin-top: 6px;
        min-height: 14px;
      }
      .config-state {
        font-size: 12px;
        margin-top: 4px;
      }
      .config-ok {
        color: #059669;
      }
      .config-missing {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <div class="header">Provenza</div>

    <div class="section">
      <div class="label">This page</div>
      <div id="current-tab-status">Checking…</div>
    </div>

    <div class="section">
      <div class="label">Connection</div>
      <div id="config-state" class="config-state"></div>
      <div id="catalog-state" class="config-state"></div>
    </div>

    <div class="section" id="settings">
      <div class="label">Settings</div>
      <input id="api-url" type="text" placeholder="Server URL (…/api/v1/shadow-ai/ingest)" />
      <input id="ingestion-key" type="password" placeholder="Ingestion key" />
      <button id="save-btn">Save</button>
      <div id="save-status" class="saved"></div>
    </div>
    <div class="section" id="managed-note" hidden>
      <div class="config-state">Managed by your organization. The settings cannot be changed here.</div>
    </div>

    <script src="../shared/domains.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
