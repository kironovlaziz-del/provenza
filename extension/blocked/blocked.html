<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not allowed — Provenza</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f6f8; --panel: #fff; --text: #1b1d23; --muted: #5b6170; --border: #dfe2e8; --accent: #2451d9; }
      @media (prefers-color-scheme: dark) { :root { --bg: #16171c; --panel: #1f2027; --text: #e6e8ee; --muted: #9aa1ad; --border: #2c2e37; --accent: #6aa9ff; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 520px; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 14px; color: var(--muted); }
      ul { margin: 0 0 16px; padding-left: 20px; }
      a { color: var(--accent); }
      .brand { font-size: 13px; color: var(--muted); margin-bottom: 18px; letter-spacing: .02em; }
      .host { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Provenza</div>
      <h1 id="title">This AI service is not allowed</h1>
      <p id="why">Your organization does not allow <span class="host" id="host"></span>. Company data must stay in the AI services it has approved.</p>
      <div id="instead" hidden>
        <p>Use one of these instead:</p>
        <ul id="allowed"></ul>
      </div>
      <p>If you need this service for your work, ask your Provenza administrator to review it.</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
