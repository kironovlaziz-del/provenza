# Alertmanager for the all-in-one prod install.
# Webhook URL is the compose service name (backend:8000), not localhost:
# in docker, "localhost" is the Alertmanager container itself.

global:
  resolve_timeout: 5m

route:
  receiver: 'ai-ct-backend'
  group_by: ['alertname', 'org_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'ai-ct-backend'
    webhook_configs:
      - url: 'http://backend:8000/api/v1/metrics/alerts'
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secret
