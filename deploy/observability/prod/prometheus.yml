# Prometheus for the all-in-one prod install (Podman Quadlet, deploy/quadlet/).
# Everything runs in containers, so the scrape target is the container name
# (backend:8000), not 127.0.0.1.
#
# The hybrid install (backend / worker / beat as systemd services) uses
# deploy/observability/prometheus.yml with 127.0.0.1:8000 instead.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'provenza-prod'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'ai-ct-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
