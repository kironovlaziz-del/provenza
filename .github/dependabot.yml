version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - backend
    ignore:
      # passlib 1.7.4 (unmaintained) breaks with bcrypt >= 4.1: its bug probe
      # hashes a password longer than 72 bytes, which bcrypt 5 refuses. Stays
      # until password hashing moves off passlib.
      - dependency-name: bcrypt
        versions: [">=4.1"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - frontend
    # react and react-dom must move together (react-dom pins the same react
    # version as a peer): one PR for the pair, never one without the other
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
