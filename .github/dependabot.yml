version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - backend

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - frontend
    # react and react-dom must move together (react-dom pins the same react
    # version as a peer): one PR for the pair, never one without the other
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        # react-i18next names the i18next it needs as a peer, one PR for the pair
      i18next:
        patterns: ["i18next", "react-i18next"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
      
