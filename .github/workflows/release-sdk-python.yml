name: Release Python SDK

# Publishes sdk/python to PyPI when a tag "sdk-python-v<version>" is pushed,
# e.g. sdk-python-v0.1.0. The tag must equal provenza.__version__.
#
# No PyPI token is stored anywhere: PyPI trusts this workflow through OIDC
# (Trusted Publishing). One-time setup on pypi.org, see sdk/python/RELEASING.md.

on:
  push:
    tags: ["sdk-python-v*"]

permissions: {}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The tag names the version being released
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/provenza/__init__.py)
          if [ "sdk-python-v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match provenza.__version__ ${version}" >&2
            exit 1
          fi

      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: sdk/python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/provenza
    permissions:
      id-token: write   # the OIDC token PyPI trusts - nothing else

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
