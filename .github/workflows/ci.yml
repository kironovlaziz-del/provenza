name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job only reads the repository; nothing here needs a token that can write.
permissions:
  contents: read

# Cancel an in-progress run when a new commit arrives on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_user
          POSTGRES_PASSWORD: ai_password
          POSTGRES_DB: ai_control_tower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: development
      DEBUG: "false"
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789abcdef
      ENCRYPTION_KEY: ""
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_control_tower
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        env:
          PGPASSWORD: ai_password
        run: |
          psql -h localhost -U ai_user -d ai_control_tower \
            -c "CREATE DATABASE ai_control_tower_test OWNER ai_user;"

      - name: Set up Node (cross-language SDK tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json

      - name: Set up Go (tests/test_sdk_go.py builds the Go SDK)
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false   # standard library only: no go.sum, nothing to cache

      - name: Build the JS SDK (tests/test_sdk_js.py runs it against this server)
        working-directory: sdk/js
        run: |
          npm ci
          npm run build

      - name: Verify app imports
        run: |
          python -c "import app.main" && echo "app.main imports OK"

      - name: Run pytest
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  install-scripts:
    name: Install and upgrade scripts (syntax, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          bash -n install.sh upgrade.sh
          for f in deploy/scripts/*.sh deploy/backend-entrypoint.sh; do sh -n "$f"; done

      - name: Shellcheck (errors)
        run: shellcheck --severity=error install.sh upgrade.sh deploy/scripts/*.sh deploy/backend-entrypoint.sh

  dependency-audit:
    name: Dependency audit (known vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.9.0
          pip-audit -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend (npm audit, production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --package-lock-only --audit-level=high

  sdk-python:
    name: Python SDK (pytest, wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]   # the oldest supported and the current

    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the SDK with its test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

      - name: Build the wheel
        run: pip wheel --no-deps . -w dist

  sdk-js:
    name: JS SDK (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ["20.19", "22"]   # the oldest supported and a current LTS

    defaults:
      run:
        working-directory: sdk/js

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Pack (what npm would publish)
        run: npm pack --dry-run

  sdk-go:
    name: Go SDK (vet, race tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: sdk/go

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod   # 1.27: crypto/mldsa
          cache: false   # standard library only: no go.sum, nothing to cache

      - name: Formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

  egress-proxy:
    name: Egress proxy (vet, race tests, static build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: proxy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
          cache: false   # standard library only

      - name: Formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: Static build
        run: CGO_ENABLED=0 go build -trimpath -o provenza-proxy .

  sdk-python-integrations:
    name: Python SDK integrations (${{ matrix.extras }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # crewai and autogen-core pin conflicting protobuf versions: separate environments
        extras: ["openai,langchain,autogen", "crewai"]

    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the SDK with ${{ matrix.extras }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,${{ matrix.extras }}]"

      - name: Run the integration tests
        run: pytest -q tests/test_integrations.py

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit

      # Blocking: medium/high findings fail the PR. A false positive gets a
      # `# nosec <test id>` with the reason on the line, not a skip here.
      - name: Bandit (static analysis)
        run: |
          bandit -r app -ll -f txt

      # Informational: a new upstream CVE should not block unrelated PRs;
      # Dependabot opens the fixes.
      - name: pip-audit (dependency vulnerabilities)
        run: |
          pip-audit -r requirements.txt || true

  docker:
    name: Docker compose (validate)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config -q && echo "docker-compose.yml is valid"
