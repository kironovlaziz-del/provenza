name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run when a new commit arrives on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_user
          POSTGRES_PASSWORD: ai_password
          POSTGRES_DB: ai_control_tower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: development
      DEBUG: "false"
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789abcdef
      ENCRYPTION_KEY: ""
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_control_tower
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        env:
          PGPASSWORD: ai_password
        run: |
          psql -h localhost -U ai_user -d ai_control_tower \
            -c "CREATE DATABASE ai_control_tower_test OWNER ai_user;"

      - name: Verify app imports
        run: |
          python -c "import app.main" && echo "app.main imports OK"

      - name: Run pytest
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] pip-audit

      # Blocking: medium/high findings fail the PR. A false positive gets a
      # `# nosec <test id>` with the reason on the line, not a skip here.
      - name: Bandit (static analysis)
        run: |
          bandit -r app -ll -f txt

      # Informational: a new upstream CVE should not block unrelated PRs;
      # Dependabot opens the fixes.
      - name: pip-audit (dependency vulnerabilities)
        run: |
          pip-audit -r requirements.txt || true

  docker:
    name: Docker compose (validate)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config -q && echo "docker-compose.yml is valid"
