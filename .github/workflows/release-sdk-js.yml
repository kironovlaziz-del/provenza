name: Release JS SDK

# Publishes sdk/js to npm when a tag "sdk-js-v<version>" is pushed, e.g.
# sdk-js-v0.2.0. The tag must equal package.json's version.
#
# No npm token is stored anywhere: npm trusts this workflow through OIDC
# (trusted publishing) and attaches a provenance attestation. One-time setup:
# sdk/js/RELEASING.md.

on:
  push:
    tags: ["sdk-js-v*"]

permissions: {}

jobs:
  publish:
    name: Test and publish to npm
    runs-on: ubuntu-latest   # trusted publishing needs a GitHub-hosted runner
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/provenza
    permissions:
      contents: read
      id-token: write          # the OIDC token npm trusts - nothing else
    defaults:
      run:
        working-directory: sdk/js

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24 (ships npm >= 11.5.1, which trusted publishing needs)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: The tag names the version being released
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "sdk-js-v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install, build, test
        run: |
          npm ci
          npm test

      - name: Publish
        run: npm publish --provenance --access public
