name: Release JS SDK

# Stages sdk/js on npm when a tag "sdk-js-v<version>" is pushed, e.g.
# sdk-js-v0.2.0. The tag must equal package.json's version.
#
# No npm token is stored anywhere: npm trusts this workflow through OIDC
# (trusted publishing) and attaches a provenance attestation. The workflow
# only stages the version (npm stage publish); it goes live when a
# maintainer approves it on npmjs.com with their npm two-factor
# authentication, so neither this workflow nor a GitHub account alone can
# release a version. One-time setup and each release: sdk/js/RELEASING.md.

on:
  push:
    tags: ["sdk-js-v*"]

permissions: {}

jobs:
  publish:
    name: Test and stage on npm
    runs-on: ubuntu-latest   # trusted publishing needs a GitHub-hosted runner
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/provenza
    permissions:
      contents: read
      id-token: write          # the OIDC token npm trusts - nothing else
    defaults:
      run:
        working-directory: sdk/js

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm 11.15.0 (staged publishing needs it)
        run: npm install -g npm@11.15.0 && npm --version

      - name: The tag names the version being released
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "sdk-js-v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install, build, test
        run: |
          npm ci
          npm test

      - name: Stage for a maintainer's approval
        run: npm stage publish --provenance --access public
